<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File Form</title>
</head>
<body>
    <form id="uploadForm" name="uploadForm" enctype="multipart/form-data" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="file">Upload File:</label>
        <input type="file" id="file" name="file" required><br><br>
        
        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById('uploadForm').onsubmit = function(e) {
            e.preventDefault();

            var formData = new FormData(this);

            fetch('https://script.google.com/macros/s/AKfycbywSPltFtYRrUEINR0WNIPxyb3Bjpuup8GFIS97suxuMkWhHqmLH6We2Pimr0hUGkuFdw/exec', {  // Replace with your Web App URL
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => alert('Success: ' + data))
            .catch(error => alert('Error: ' + error));
        };
    </script>
</body>
</html>
